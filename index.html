<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cotxe Uni">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F7F5">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<title>Cotxe Uni</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111113'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23F7F7F5' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23F7F7F5'/%3E%3Cpath d='M15 32h13M36 32h13M32 36v13' stroke='%23F7F7F5' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23111113'/%3E%3Ccircle cx='90' cy='90' r='46' fill='none' stroke='%23F7F7F5' stroke-width='10'/%3E%3Ccircle cx='90' cy='90' r='10' fill='%23F7F7F5'/%3E%3Cpath d='M44 90h36M100 90h36M90 100v36' stroke='%23F7F7F5' stroke-width='10' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F7F7F5; --surface:#FFFFFF; --line:#E4E4E7; --line-strong:#D4D4D8;
  --text:#111113; --muted:#63636A; --faint:#A1A1AA;
  --accent:#1D4ED8; --accent-press:#1E40AF; --accent-soft:#EEF2FD;
  --neg:#B91C1C;
  --r:10px; --r-sm:8px;
  --tap:48px;
  --gutter:16px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg);scroll-padding-top:124px;scroll-padding-bottom:150px}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.4;
  -webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,select{font-size:16px}
.num,.amt,time{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Layout ---------- */
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 var(--gutter)}
.top{position:sticky;top:0;z-index:20;background:rgba(247,247,245,.96);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.top-row{display:flex;align-items:center;gap:8px;height:56px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;margin-right:auto;white-space:nowrap}
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-sm);color:var(--text)}
.iconbtn:active{background:var(--line)}
.sync{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 6px;font-size:13px;color:var(--muted);white-space:nowrap;border-radius:var(--r-sm)}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync[data-s="ok"] .dot{background:#15803D}
.sync[data-s="busy"] .dot{background:var(--accent)}
.sync[data-s="error"]{color:var(--neg)}
.sync[data-s="error"] .dot{background:var(--neg)}
.sync[data-s="error"]:active{background:#FBEAEA}

.weeknav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:56px;gap:4px}
.weeklabel{display:flex;flex-direction:column;align-items:center;justify-content:center;height:48px;border-radius:var(--r-sm);line-height:1.15}
.weeklabel:active{background:var(--line)}
.weeklabel b{font-size:16px;font-weight:600}
.weeklabel span{font-size:12px;color:var(--muted)}
.weeklabel .settled{color:var(--accent);font-weight:500}

main.wrap{padding-top:12px;padding-bottom:calc(140px + var(--safe-b))}
.days{display:grid;grid-template-columns:1fr;gap:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 4px}
.day-h{display:flex;align-items:baseline;gap:8px;padding:0 2px 8px}
.day-h b{font-size:15px;font-weight:600}
.day-h time{font-size:13px;color:var(--muted)}
.day-h .today{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.day.is-today{border-color:var(--text)}

.leg{border-top:1px solid var(--line);padding:10px 0 10px}
.leg-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 2px 8px}
.leg-h .dir{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.leg-h .meta{font-size:12px;color:var(--muted);text-align:right}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pill{height:var(--tap);min-width:44px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);
  font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;position:relative;transition:background-color .08s,border-color .08s}
.pill:active{transform:scale(.97);background:var(--line)}
.pill[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:#fff}
.pill[aria-pressed="true"]:active{background:#2A2A2E}
.pill.is-driver{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.is-driver:active{background:var(--accent-press)}
.pill .badge{position:absolute;top:4px;right:4px;width:12px;height:12px;stroke-width:2}
.drv-cap{font-size:11px;color:var(--muted);padding:8px 2px 4px;letter-spacing:.02em}
.drv{height:44px;min-width:44px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;gap:4px;color:var(--faint);
  border:1px solid transparent;font-size:12px;font-weight:600}
.drv:active{background:var(--line)}
.drv[aria-checked="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.drv svg.i{width:18px;height:18px}

.weekend-toggle{width:100%;min-height:48px;border:1px dashed var(--line-strong);border-radius:var(--r);color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.weekend-toggle:active{background:var(--line)}

/* ---------- Bottom bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.bar-in{display:flex;flex-direction:column;gap:8px;padding:10px var(--gutter) 10px}
.bar-sum{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);gap:8px;min-width:0}
.bar-sum b{color:var(--text);font-weight:600}
.bar-sum span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-act{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{min-height:48px;border-radius:var(--r-sm);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;padding:0 14px;border:1px solid var(--line-strong);background:var(--surface)}
.btn:active{background:var(--line)}
.btn.primary{background:var(--text);border-color:var(--text);color:#fff}
.btn.primary:active{background:#2A2A2E}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.accent:active{background:var(--accent-press)}
.btn.ghost{border-color:transparent;color:var(--muted);font-weight:500}
.btn.danger{color:var(--neg)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- Sheets ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(17,17,19,.32);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:14px 14px 0 0;border:1px solid var(--line);
  padding:0 0 calc(16px + var(--safe-b));overscroll-behavior:contain}
.sheet-h{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:8px 8px 8px var(--gutter);border-bottom:1px solid var(--line);z-index:1}
.sheet-h h2{font-size:17px;font-weight:600;margin-right:auto}
.sheet-b{padding:16px var(--gutter) 0;display:flex;flex-direction:column;gap:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#EDEDEA;border-radius:var(--r-sm);padding:3px;gap:3px}
.seg button{min-height:44px;border-radius:6px;font-size:14px;font-weight:500;color:var(--muted);line-height:1.15;padding:4px}
.seg button small{display:block;font-size:11px;font-weight:400}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card-h{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 14px 0}
.rows{list-style:none}
.rows li{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.ini{width:28px;height:28px;border-radius:6px;background:var(--bg);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex:none}
.balbar{flex:1;height:6px;position:relative;background:transparent}
.balbar::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line-strong)}
.balbar i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--text)}
.balbar i.neg{background:var(--neg)}
.amt{font-weight:600;min-width:84px;text-align:right}
.amt.neg{color:var(--neg)}
.amt.zero{color:var(--faint);font-weight:500}
.xfer{display:flex;align-items:center;gap:10px;flex:1}
.xfer svg.i{color:var(--muted);width:18px;height:18px}
.empty{padding:16px 14px;color:var(--muted);font-size:14px}
.note{font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.inrow{display:flex;gap:8px}
.input{min-height:48px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);padding:0 12px;font-size:16px;width:100%;min-width:0}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.manual{width:100%;min-height:220px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;line-height:1.4;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);resize:vertical}

/* ---------- PIN ---------- */
.pin{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px var(--gutter) calc(24px + var(--safe-b))}
.pin form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:16px}
.pin h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.pin p{color:var(--muted);font-size:15px;margin-top:-10px}
.pin-input{height:64px;text-align:center;font-size:32px!important;letter-spacing:.5em;padding-left:.5em;font-weight:600;font-variant-numeric:tabular-nums}
.pin-err{color:var(--neg);font-size:14px;min-height:20px}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(132px + var(--safe-b));z-index:50;background:var(--text);color:#fff;font-size:14px;
  padding:10px 14px;border-radius:var(--r-sm);max-width:calc(100% - 32px);text-align:center}

/* ---------- Desktop ---------- */
@media (min-width:760px){
  .days{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bar-in{flex-direction:row;align-items:center;max-width:1120px;margin:0 auto}
  .bar-sum{flex:1;flex-direction:column;align-items:flex-start;gap:0}
  .bar-act{grid-template-columns:auto auto}
  main.wrap{padding-bottom:calc(100px + var(--safe-b))}
  .toast{bottom:calc(92px + var(--safe-b))}
  .scrim{align-items:center;padding:24px}
  .sheet{border-radius:14px;max-height:86vh}
}
@media (min-width:1100px){ .days{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-wheel" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M3.5 10.5h6.5M14 10.5h6.5M12 14v7"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
  <symbol id="i-scale" viewBox="0 0 24 24"><path d="M4 7h16M7 7v12M17 7v12M4 19h6M14 19h6"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15M14 7l5 5-5 5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
</svg>

<div id="pinScreen" class="pin" hidden>
  <form id="pinForm" novalidate>
    <h1>Cotxe Uni</h1>
    <p>PIN del grup</p>
    <input id="pinInput" class="input pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4"
      autocomplete="one-time-code" aria-label="PIN de 4 xifres" enterkeyhint="go">
    <div id="pinErr" class="pin-err" role="alert"></div>
    <button id="pinBtn" class="btn primary" type="submit">Entrar</button>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="wrap">
      <div class="top-row">
        <div class="brand">Cotxe Uni</div>
        <button id="syncBtn" class="sync" data-s="idle" type="button" aria-live="polite"><span class="dot"></span><span id="syncTxt">Carregant…</span></button>
        <button id="refreshBtn" class="iconbtn" type="button" aria-label="Actualitzar"><svg class="i"><use href="#i-refresh"/></svg></button>
        <button id="settingsBtn" class="iconbtn" type="button" aria-label="Configuració"><svg class="i"><use href="#i-gear"/></svg></button>
      </div>
      <nav class="weeknav" aria-label="Setmana">
        <button id="prevWeek" class="iconbtn" type="button" aria-label="Setmana anterior"><svg class="i"><use href="#i-left"/></svg></button>
        <button id="weekLabel" class="weeklabel" type="button" aria-label="Anar a la setmana actual"></button>
        <button id="nextWeek" class="iconbtn" type="button" aria-label="Setmana següent"><svg class="i"><use href="#i-right"/></svg></button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div id="days" class="days"></div>
    <div style="margin-top:12px"><button id="weekendBtn" class="weekend-toggle" type="button"></button></div>
  </main>

  <footer class="bar">
    <div class="bar-in">
      <div class="bar-sum"><span id="sumWeek"></span><span id="sumTotal"></span></div>
      <div class="bar-act">
        <button id="openSettle" class="btn primary" type="button"><svg class="i"><use href="#i-scale"/></svg>Liquidació</button>
        <button id="copyBtn" class="btn" type="button"><svg class="i"><use href="#i-copy"/></svg>Copiar resum</button>
      </div>
    </div>
  </footer>
</div>

<div id="settleSheet" class="scrim" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="settleTitle">
    <div class="sheet-h"><h2 id="settleTitle">Liquidació</h2>
      <button class="iconbtn" type="button" data-close aria-label="Tancar"><svg class="i"><use href="#i-close"/></svg></button></div>
    <div class="sheet-b">
      <div class="seg" role="tablist">
        <button id="tabWeek" role="tab" type="button" aria-selected="true">Setmana<small id="tabWeekSub"></small></button>
        <button id="tabTotal" role="tab" type="button" aria-selected="false">Total pendent<small id="tabTotalSub"></small></button>
      </div>
      <div id="settleBody"></div>
    </div>
  </section>
</div>

<div id="settingsSheet" class="scrim" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <div class="sheet-h"><h2 id="setTitle">Configuració</h2>
      <button class="iconbtn" type="button" data-close aria-label="Tancar"><svg class="i"><use href="#i-close"/></svg></button></div>
    <div class="sheet-b">
      <form id="priceForm" class="card" style="padding:14px" novalidate>
        <div class="field">
          <label for="priceInput">Tarifa per trajecte (€)</label>
          <div class="inrow">
            <input id="priceInput" class="input num" type="text" inputmode="decimal" autocomplete="off" aria-describedby="priceNote">
            <button class="btn primary" type="submit">Desar</button>
          </div>
          <div id="priceNote" class="note">S'aplica als trajectes nous. Els trajectes ja registrats conserven la seva tarifa.</div>
        </div>
      </form>
      <button id="logoutBtn" class="btn ghost danger" type="button">Canviar PIN / Sortir</button>
    </div>
  </section>
</div>

<div id="copySheet" class="scrim" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="copyTitle">
    <div class="sheet-h"><h2 id="copyTitle">Resum per a WhatsApp</h2>
      <button class="iconbtn" type="button" data-close aria-label="Tancar"><svg class="i"><use href="#i-close"/></svg></button></div>
    <div class="sheet-b">
      <p class="note">No s'ha pogut copiar automàticament. Mantén premut el text per seleccionar-lo i copiar-lo.</p>
      <textarea id="copyText" class="manual" readonly></textarea>
    </div>
  </section>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<!-- Engine (pure logic + Supabase RPC + optimistic store), inlined from carpool-engine.js -->
<script id="carpool-engine">
/*!
 * carpool-engine.js — Cotxe Uni: pure logic + Supabase RPC layer.
 * Zero dependencies. Works as a browser <script> (window.CarpoolEngine) or a CommonJS module.
 *
 * Money model: every amount is an integer number of cents. Internally, trip shares are
 * computed in "units" of 1/UNIT cent, where UNIT = lcm(1..5) = 60, so price/N is exact
 * for any N in 1..5. Rounding to cents happens once, at the end, with a deterministic
 * largest-remainder method that keeps the sum of balances exactly 0.
 */
(function (root, factory) {
  'use strict';
  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.CarpoolEngine = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var MEMBERS = Object.freeze(['A', 'J', 'M', 'Q', 'R']);
  var DIRECTIONS = Object.freeze(['anada', 'tornada']);
  var MEMBER_SET = new Set(MEMBERS);

  function gcd(a, b) { while (b) { var t = a % b; a = b; b = t; } return a; }
  var UNIT = 1;
  for (var i = 1; i <= MEMBERS.length; i++) UNIT = (UNIT * i) / gcd(UNIT, i); // 60

  function zeroMap() { var o = {}; MEMBERS.forEach(function (m) { o[m] = 0; }); return o; }

  /* ------------------------------------------------------------------ dates */
  var DATE_RE = /^(\d{4})-(\d{2})-(\d{2})$/;
  var WEEK_RE = /^(\d{4})-W(\d{2})$/;
  var DAY_MS = 86400000;

  function parseDate(s) {
    var m = typeof s === 'string' && DATE_RE.exec(s);
    if (!m) throw new Error('INVALID_DATE: ' + s);
    var y = +m[1], mo = +m[2], d = +m[3];
    var t = Date.UTC(y, mo - 1, d);
    var dt = new Date(t);
    if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) {
      throw new Error('INVALID_DATE: ' + s);
    }
    return t;
  }
  function fmtDate(t) {

    q.promise = (function loop() {

  };

  return Object.freeze({
    MEMBERS: MEMBERS, DIRECTIONS: DIRECTIONS, UNIT: UNIT, DEFAULT_PRICE: DEFAULT_PRICE,
    PIN_KEY: PIN_KEY, CACHE_KEY: CACHE_KEY,
    isoWeekId: isoWeekId, weekDates: weekDates, shiftWeek: shiftWeek, currentWeekId: currentWeekId,
    todayLocal: todayLocal, weekRangeLabel: weekRangeLabel, dayLabel: dayLabel, tripKey: tripKey,
    formatCents: formatCents, normalizeTrip: normalizeTrip, togglePassenger: togglePassenger, setDriver: setDriver,
    computeBalances: computeBalances, weekBalances: weekBalances, pendingBalances: pendingBalances,
    pendingWeekIds: pendingWeekIds, isWeekSettled: isWeekSettled, tripsOfWeek: tripsOfWeek,

<script id="app">
/* UI layer: rendering + events only. All money, dates, sync and caching live in CarpoolEngine. */
(function () {
  'use strict';
  var SUPABASE_URL = 'https://gbtbsavxndpbnkqngmbz.supabase.co';
  var SUPABASE_PUBLIC_KEY = 'sb_publishable__CJ6vqOKr-P0NGrbs2aoyA_1muAmd9r'; // public (publishable) key only
  var LS_WEEKEND = 'uni_carpool_weekend_v1';

  var E = window.CarpoolEngine, M = E.MEMBERS;
  var DAY_LONG = ['Dilluns', 'Dimarts', 'Dimecres', 'Dijous', 'Divendres', 'Dissabte', 'Diumenge'];
  var MONTHS = ['gen', 'febr', 'març', 'abr', 'maig', 'juny', 'jul', 'ag', 'set', 'oct', 'nov', 'des'];

  function $(id) { return document.getElementById(id); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function eur(c, sign) { return (sign && c > 0 ? '+' : '') + E.formatCents(c).replace(/^-/, '−'); }
  function dayMonth(ymd) { var p = ymd.split('-'); return (+p[2]) + ' ' + MONTHS[+p[1] - 1]; }
  function parseEurToCents(input) {
    var s = String(input == null ? '' : input).trim().replace(/\s|€/g, '');
    if (!/^\d{1,4}([.,]\d{1,2})?$/.test(s)) return null;
    var parts = s.replace('.', ',').split(',');
    return parseInt(parts[0], 10) * 100 + (parts[1] ? parseInt((parts[1] + '0').slice(0, 2), 10) : 0);
  }

  var storage = null; try { storage = window.localStorage; } catch (e) { storage = null; }
  var client = E.SupabaseClient({ url: SUPABASE_URL, key: SUPABASE_PUBLIC_KEY, fetch: window.__carpoolFetch });
  var store = E.CarpoolStore({ client: client, storage: storage, onChange: function () { schedule(); } });

  var ui = { weekId: E.currentWeekId(), tab: 'week', weekendOpen: {}, refreshing: false, weekBusy: false, wasLoggedIn: store.hasPin() };
  try { ui.weekendOpen = JSON.parse(lsGet(LS_WEEKEND) || '{}') || {}; } catch (e) { ui.weekendOpen = {}; }

  function trips() { return store.state.trips; }
  function weeks() { return store.state.weeks; }
  function settled(w) { return E.isWeekSettled(weeks(), w); }
  function quiet(p) { if (p && p.catch) p.catch(function () { /* surfaced via store.status */ }); }

  // ---------------- Render scheduling (one frame per burst of store events) ----------------
  var raf = 0;
  function schedule() {
    if (raf) return;

  }
  function onStoreChange() {
    if (!store.hasPin()) {

      return;
    }
    render(); renderSync();
  }

  // ---------------- Rendering ----------------
  function svg(id, cls) { return '<svg class="i' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#' + id + '"/></svg>'; }
  function legMeta(t) {
    var n = t.passengers.length, price = t.price_cents;
    if (!n) return '';
    if (!t.driver) return n + (n === 1 ? ' ocupant' : ' ocupants') + ' · sense conductor';
    if (n === 1) return 'Només conductor · 0,00 €';

  }
  function legHTML(ymd, dir) {
    var t = store.getTrip(ymd, dir), label = dir === 'anada' ? 'Anada' : 'Tornada';
    var pills = M.map(function (m) {
      var on = t.passengers.indexOf(m) !== -1, drv = t.driver === m;
      return '<button type="button" class="pill' + (drv ? ' is-driver' : '') + '" data-act="pax" data-m="' + m + '" aria-pressed="' + on + '"'

    }).join('');

      return '<button type="button" class="drv" role="radio" data-act="drv" data-m="' + m + '" aria-checked="' + (t.driver === m) + '" aria-label="Condueix ' + m + '">'

    }).join('');
    return '<div class="leg" data-date="' + ymd + '" data-dir="' + dir + '">'
      + '<div class="leg-h"><span class="dir">' + label + '</span><span class="meta num">' + esc(legMeta(t)) + '</span></div>'
      + '<div class="grid5" role="group" aria-label="Ocupants ' + label + '">' + pills + '</div>'
      + '<div class="drv-cap">Qui condueix</div>'
      + '<div class="grid5" role="radiogroup" aria-label="Conductor ' + label + '">' + drivers + '</div>'
      + '</div>';
  }
  function hasTrips(ymd) {
    return E.DIRECTIONS.some(function (d) { return store.getTrip(ymd, d).passengers.length > 0; });
  }
  function renderDays() {
    var dates = E.weekDates(ui.weekId), today = E.todayLocal();
    var weekendHas = hasTrips(dates[5]) || hasTrips(dates[6]);
    var showWeekend = weekendHas || !!ui.weekendOpen[ui.weekId];
    var html = '';

      if (i >= 5 && !showWeekend) return;
      var isToday = ymd === today;
      html += '<section class="day' + (isToday ? ' is-today' : '') + '" id="d-' + ymd + '">'
        + '<div class="day-h"><b>' + DAY_LONG[i] + '</b><time datetime="' + ymd + '">' + dayMonth(ymd) + '</time>'

    var wb = $('weekendBtn');

  }
  function renderHeader() {
    var w = ui.weekId;
    var sub = w === E.currentWeekId() ? 'Aquesta setmana' : 'Setmana ' + parseInt(w.split('-W')[1], 10);
    $('weekLabel').innerHTML = '<b class="num">' + esc(E.weekRangeLabel(w)) + '</b><span class="num">'
      + (settled(w) ? '<span class="settled">Liquidada</span> · ' : '') + esc(sub) + '</span>';
  }
  function weekTransfers(w) { return E.minimalTransfers(E.weekBalances(trips(), w)); }
  function totalTransfers() { return E.minimalTransfers(E.pendingBalances(trips(), weeks())); }
  function sumCents(xs) { return xs.reduce(function (a, x) { return a + x.cents; }, 0); }
  function nBizums(n) { return n + (n === 1 ? ' Bizum' : ' Bizums'); }
  function renderBar() {
    var wt = weekTransfers(ui.weekId), tt = totalTransfers();
    $('sumWeek').innerHTML = settled(ui.weekId) ? 'Setmana: <b>liquidada</b>'
      : wt.length ? 'Setmana: <b class="num">' + nBizums(wt.length) + ' · ' + eur(sumCents(wt)) + '</b>'
      : 'Setmana: <b>tot quadra</b>';
    $('sumTotal').innerHTML = 'Pendent total: <b class="num">' + (tt.length ? nBizums(tt.length) : 'cap') + '</b>';
  }
  function balanceList(bal) {
    var max = 1;
    M.forEach(function (m) { max = Math.max(max, Math.abs(bal[m])); });
    return '<ul class="rows">' + M.map(function (m) {
      var v = bal[m], w = Math.round(Math.abs(v) / max * 50);
      var bar = v ? '<i class="' + (v < 0 ? 'neg' : '') + '" style="' + (v < 0 ? 'right:50%' : 'left:50%') + ';width:' + w + '%"></i>' : '';
      return '<li><span class="ini">' + m + '</span><span class="balbar" aria-hidden="true">' + bar + '</span>'
        + '<span class="amt num' + (v < 0 ? ' neg' : v === 0 ? ' zero' : '') + '">' + eur(v, true) + '</span></li>';
    }).join('') + '</ul>';
  }
  function transferList(xs) {
    if (!xs.length) return '<div class="empty">Cap Bizum pendent. Tot quadra.</div>';
    return '<ul class="rows">' + xs.map(function (x) {
      return '<li aria-label="' + x.from + ' paga ' + esc(eur(x.cents)) + ' a ' + x.to + '"><span class="xfer"><span class="ini">' + x.from + '</span>'
        + svg('i-arrow') + '<span class="ini">' + x.to + '</span></span><span class="amt num">' + eur(x.cents) + '</span></li>';
    }).join('') + '</ul>';
  }
  function renderSettle() {
    if ($('settleSheet').hidden) return;
    var isWeek = ui.tab === 'week';
    $('tabWeek').setAttribute('aria-selected', String(isWeek));
    $('tabTotal').setAttribute('aria-selected', String(!isWeek));
    $('tabWeekSub').textContent = E.weekRangeLabel(ui.weekId);
    var nW = E.pendingWeekIds(trips(), weeks()).length;
    $('tabTotalSub').textContent = nW ? nW + (nW === 1 ? ' setmana oberta' : ' setmanes obertes') : 'Cap setmana oberta';
    var bal = isWeek ? E.weekBalances(trips(), ui.weekId) : E.pendingBalances(trips(), weeks());
    var html = '<div class="card"><div class="card-h">Bizums a fer</div>' + transferList(E.minimalTransfers(bal)) + '</div>'
      + '<div class="card"><div class="card-h">Balanç net</div>' + balanceList(bal) + '</div>';
    if (isWeek) {
      var st = settled(ui.weekId);
      html += '<button id="settleToggle" type="button" class="btn ' + (st ? '' : 'accent') + '"' + (ui.weekBusy ? ' disabled' : '') + '>'
        + (st ? 'Desmarcar com a liquidada' : svg('i-check') + 'Marcar setmana com a liquidada') + '</button>'
        + (st ? '<p class="note">Aquesta setmana ja no compta al total pendent.</p>' : '');
    } else {
      html += '<p class="note">Inclou totes les setmanes no marcades com a liquidades.</p>';
    }
    $('settleBody').innerHTML = html;
  }
  function render() { renderHeader(); renderDays(); renderBar(); renderSettle(); }

  function renderSync() {
    var b = $('syncBtn'), s, label;
    if (store.status === 'error') { s = 'error'; label = 'Error de xarxa — Reintentar'; }
    else if (store.status === 'syncing' || ui.refreshing) { s = 'busy'; label = 'Sincronitzant…'; }
    else if (store.status === 'saved' || !store.fromCache) { s = 'ok'; label = 'Guardat'; }
    else { s = 'idle'; label = 'Carregant…'; }
    b.dataset.s = s; $('syncTxt').textContent = label; b.setAttribute('aria-label', label);
  }

  var toastTimer = null;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2200);
  }

  // ---------------- Network ----------------
  function refresh(manual) {
    if (!store.hasPin() || ui.refreshing) return;
    ui.refreshing = true; renderSync();
    store.refresh().then(function () { if (manual) toast('Actualitzat'); }, function (err) {
      if (err && err.code === 'PIN_LOCKED') toast(pinErrorText(err));
      else if (err && err.code !== 'PIN_INVALID' && manual) toast('Sense connexió. Mostrant les dades desades.');
    }).then(function () { ui.refreshing = false; renderSync(); });
  }
  function retryAll() { quiet(store.retry()); refresh(false); }

  // ---------------- Sheets ----------------
  var SHEETS = ['settleSheet', 'settingsSheet', 'copySheet'], lastFocus = null;
  function openSheet(id) {
    lastFocus = document.activeElement;
    $(id).hidden = false; document.body.style.overflow = 'hidden';
    var c = $(id).querySelector('[data-close]'); if (c) c.focus();
  }
  function closeSheet(id) {
    $(id).hidden = true;
    if (SHEETS.every(function (s) { return $(s).hidden; })) document.body.style.overflow = '';

})();
